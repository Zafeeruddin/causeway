name: cam-dashboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cam}
      POSTGRES_DB: ${POSTGRES_DB:-cam}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cam}"]
      interval: 5s
      retries: 10
    networks: [control]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [control]

  # Object store. Point MINIO_VOLUME at the NAS mount in production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes: ["${MINIO_VOLUME:-./data/minio}:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10
    networks: [control]

  # Creates the app's own bucket and a service account scoped to it.
  # Never hand the application the root credentials.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-cam-recordings}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cam-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes: ["./deploy/minio-init.sh:/init.sh:ro"]
    networks: [control]

  # RTSP in, WebRTC and LL-HLS out. Handles preview reconnection on its own.
  mediamtx:
    image: bluenviron/mediamtx:latest
    environment:
      MTX_PROTOCOLS: tcp
    volumes: ["./deploy/mediamtx.yml:/mediamtx.yml:ro"]
    ports: ["8889:8889", "8189:8189/udp", "8888:8888"]
    networks: [control]

  api:
    build: {context: ./backend, dockerfile: ../deploy/api.Dockerfile}
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [work:/var/lib/cam/work]
    networks: [control]

  # Holds the VPN clients, the SSH masters and the ffmpeg recorders.
  #
  # NET_ADMIN is what lets it create one network namespace per connection
  # profile. /dev/ppp is openfortivpn's; without it pppd fails with a message
  # that does not mention the device.
  agent:
    build: {context: ./backend, dockerfile: ../deploy/agent.Dockerfile}
    env_file: [.env]
    depends_on:
      api: {condition: service_started}
    cap_add: [NET_ADMIN]
    devices: ["/dev/ppp:/dev/ppp"]
    sysctls: {net.ipv4.ip_forward: 1}
    volumes:
      - work:/var/lib/cam/work
      - ctl:/run/cam/ctl
    networks: [control]

volumes:
  pgdata:
  redisdata:
  work:
  ctl:

networks:
  # The namespaces' control route points here -- see app/net/netns.py.
  control:
    driver: bridge
    ipam:
      config: [{subnet: 172.28.0.0/16}]
