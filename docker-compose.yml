name: cam-dashboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cam}
      POSTGRES_DB: ${POSTGRES_DB:-cam}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cam}"]
      interval: 5s
      retries: 10
    networks: [control]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [control]

  # RTSP in, WebRTC and LL-HLS out. Handles preview reconnection on its own.
  mediamtx:
    # Pinned. `latest` moved us from 1.16 to 1.20 mid-deployment on a plain
    # restart, which is not a thing a recreate should be able to do.
    image: bluenviron/mediamtx:1.20.1
    environment:
      MTX_PROTOCOLS: tcp
      # WebRTC offers the browser whatever addresses MediaMTX can see, which in
      # here is a 172.28.x.x bridge address no other machine can reach: the
      # session negotiates and then video never starts, with nothing logged.
      # PREVIEW_HOST must be the address browsers actually dial; the default
      # only holds when the browser is on this machine.
      MTX_WEBRTCADDITIONALHOSTS: ${PREVIEW_HOST:-127.0.0.1}
    volumes: ["./deploy/mediamtx.yml:/mediamtx.yml:ro"]
    # 8889 signalling and 8189 media are for browsers. The RTSP ingest and the
    # control API are bound to loopback instead: they are how a single-process
    # dev run (make api) publishes and manages paths, and neither has any
    # authentication in front of it.
    ports:
      - "8889:8889"
      - "8189:8189/udp"
      - "8888:8888"
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:9997:9997"
    networks: [control]

  api:
    build: {context: ./backend, dockerfile: ../deploy/api.Dockerfile}
    env_file: [.env]
    # Namespaces belong to a container, so this one cannot dial, forward or
    # record. It asks the agent over Redis instead -- see app/services/gateway.py.
    environment:
      CONNECT_MODE: agent
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [work:/var/lib/cam/work]
    networks: [control]

  # Holds the VPN clients, the SSH masters and the ffmpeg recorders.
  #
  # NET_ADMIN is what lets it configure one network namespace per connection
  # profile, but creating one is a mount -- `ip netns add` bind-mounts the
  # namespace under /run/netns and makes that mount shared -- so it needs
  # SYS_ADMIN as well, and AppArmor's docker-default profile refuses the mount
  # even once the capability is there. All three are required: with NET_ADMIN
  # alone `ip netns add` fails "mount --make-shared /run/netns failed:
  # Operation not permitted"; adding SYS_ADMIN turns that into "Permission
  # denied", which is AppArmor talking, not the kernel.
  #
  # /dev/ppp is openfortivpn's; without it pppd fails with a message that does
  # not mention the device.
  agent:
    build: {context: ./backend, dockerfile: ../deploy/agent.Dockerfile}
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # SIGTERM tells live recordings to wind up, and winding up means joining and
    # uploading what is already on disk. The 10s default would kill that
    # mid-upload and strand the segments on the work volume.
    stop_grace_period: 120s
    cap_add: [NET_ADMIN, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    devices: ["/dev/ppp:/dev/ppp"]
    sysctls: {net.ipv4.ip_forward: 1}
    volumes:
      - work:/var/lib/cam/work
      - ctl:/run/cam/ctl
    networks: [control]

volumes:
  pgdata:
  redisdata:
  work:
  ctl:

networks:
  # The namespaces' control route points here -- see app/net/netns.py.
  control:
    driver: bridge
    ipam:
      # Pinned so the namespaces' control route has something stable to point
      # at, and overridable because a machine with other Docker projects on it
      # will already own this range -- compose fails to create the network
      # outright when it overlaps. Keep any replacement inside CONTROL_CIDRS.
      config: [{subnet: "${CONTROL_SUBNET:-172.28.0.0/16}"}]
