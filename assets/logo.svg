<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Causeway">
  <title>Causeway</title>
  <!--
    A raised road on arches, crossing water, with a lens at the far end.

    The arches are the hops (VPN, jump host, forward) and the deck laid across
    them is the point: the far side has not moved, there is simply a way to
    reach it now.

    Explicit colours rather than currentColor. An SVG loaded through an img
    tag, which is how GitHub renders one, is an isolated document: the
    surrounding `color` never reaches it and currentColor falls back to black,
    so on a dark README the logo would be invisible. This mid-slate reads on
    white and on GitHub's near-black alike; only the lens takes the accent.

    (Note for anyone editing: a double hyphen cannot appear inside an XML
    comment. It is legal prose and an illegal SVG file.)
  -->
  <g fill="none" stroke="#7d94a3" stroke-linecap="round" stroke-linejoin="round">
    <!-- the deck -->
    <path d="M2 30h60" stroke-width="4.5"/>
    <!-- piers and arches beneath it -->
    <path d="M12 30v10a8 8 0 0 0 16 0V30" stroke-width="3" opacity=".75"/>
    <path d="M36 30v10a8 8 0 0 0 16 0V30" stroke-width="3" opacity=".75"/>
    <!-- water -->
    <path d="M2 52q6-3 12 0t12 0 12 0 12 0 12 0" stroke-width="2.5" opacity=".55"/>
    <path d="M2 59q6-3 12 0t12 0 12 0 12 0 12 0" stroke-width="2.5" opacity=".3"/>
  </g>
  <!-- what is on the far side: the camera the road was built to reach -->
  <circle cx="52" cy="14" r="5" fill="#79b7d8"/>
  <circle cx="52" cy="14" r="9.5" fill="none" stroke="#79b7d8" stroke-width="2.2" opacity=".4"/>
</svg>
