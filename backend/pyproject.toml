[project]
name = "cam-dashboard"
version = "0.2.0"
description = "Team-scoped control plane for tunnelled camera streams"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "pynacl>=1.5",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "boto3>=1.35",
    "structlog>=24.4",
]

[project.scripts]
cam = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    # Our probes and drivers take an explicit `timeout` because each one wraps a
    # subprocess with its own deadline semantics -- asyncio.timeout would cancel
    # the coroutine without killing the child process, which is the bug this
    # argument exists to avoid.
    "ASYNC109",
    # FastAPI's Depends()/Cookie() in defaults is the framework's own idiom.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Client output is quoted verbatim; reflowing it would stop it matching reality.
"tests/test_vpn_drivers.py" = ["E501"]
# The scripted ffmpeg writes the files a real one would have written. Pushing
# those two-line stubs onto a worker thread would obscure what they stand in for.
"tests/test_recorder.py" = ["ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
