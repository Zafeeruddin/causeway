# Production stack: pulls from Harbor, builds nothing.
#
# The target host needs exactly three files -- this one, `.env`, and
# `mediamtx.yml` beside it. No repository, no toolchain, no node.
#
#   docker compose -f compose.prod.yml --env-file .env up -d
#
# Every host-side port is overridable, because a machine that already runs other
# things will collide with at least one of them:
#
#   API_BIND=127.0.0.1:8100     WEB_BIND=127.0.0.1:3000
#   WHEP_BIND=127.0.0.1:8889    MEDIA_BIND=8189
#
# MEDIA_BIND is the optional low-latency fast path. Everything else is loopback
# for nginx/Next to proxy, including the automatic HLS fallback over HTTPS.
#
# Every service restarts unless stopped, so the stack survives a reboot.

name: cam-dashboard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cam}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cam}"]
      interval: 5s
      retries: 10
    networks: [control]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [control]

  mediamtx:
    # Pinned. `latest` moved us from 1.16 to 1.20 mid-deployment on a plain
    # restart, which is not a thing a recreate should be able to do.
    image: bluenviron/mediamtx:1.20.1
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: tcp
      # The address browsers dial for the UDP media leg. Wrong value and the
      # session negotiates and then video never starts, with nothing logged.
      MTX_WEBRTCADDITIONALHOSTS: ${PREVIEW_HOST:?set PREVIEW_HOST to the public hostname}
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]
    ports:
      # WHEP signalling, for nginx to proxy. Loopback only.
      - "${WHEP_BIND:-127.0.0.1:8889}:8889"
      # Direct low-latency video. Publish/forward it when possible; viewers on
      # networks that block it automatically fall back to HLS over HTTPS 443.
      - "${MEDIA_BIND:-8189}:8189/udp"
      # The HLS rendition behind that fallback, for nginx to proxy. Loopback.
      #
      # It has to be nginx and not this app's own /hls rewrite: MediaMTX answers
      # the first playlist request with a 302 to /<path>/index.m3u8?cookieCheck=1
      # -- an absolute path, relative to its own root. Proxied under a prefix
      # that Location does not know about, the browser follows it out of /hls/
      # and lands on a route the dashboard does not serve. nginx fixes it with
      # one proxy_redirect; a rewrite cannot touch a response header at all.
      - "${HLS_BIND:-127.0.0.1:8888}:8888"
      #
      # RTSP ingest (8554) and the control API (9997) are deliberately NOT
      # published. The agent reaches them as `mediamtx:8554` and `mediamtx:9997`
      # over this network; the only thing a host port would serve is a
      # single-process dev run, and neither endpoint is authenticated.
    networks: [control]

  api:
    image: registry.example.com/causeway/causeway-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      CONNECT_MODE: agent
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Behind nginx. Move the host side with API_BIND if 8000 is taken.
    ports: ["${API_BIND:-127.0.0.1:8000}:8000"]
    volumes: [work:/var/lib/cam/work]
    networks: [control]

  web:
    image: registry.example.com/causeway/causeway-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Where this service's own rewrites send /api, /rtc and /hls. The defaults
    # are localhost, which is correct for a dev run and wrong in every way here:
    # localhost inside this container is this container. nginx hides two of them
    # by proxying /api and /rtc itself, so the one nobody routes -- /hls -- is
    # the one that breaks, and it breaks as "preview refused" on exactly the
    # networks that need the fallback rather than anywhere it would be noticed.
    environment:
      API_ORIGIN: http://api:8000
      MEDIAMTX_ORIGIN: http://mediamtx:8889
      MEDIAMTX_HLS_ORIGIN: http://mediamtx:8888
    depends_on: [api]
    ports: ["${WEB_BIND:-127.0.0.1:3000}:3000"]
    networks: [control]

  agent:
    image: registry.example.com/causeway/causeway-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Winding up a live recording means joining and uploading what is on disk.
    # The 10s default kills that mid-upload and strands the segments.
    stop_grace_period: 120s
    # Creating a namespace is a mount: NET_ADMIN alone gives "Operation not
    # permitted", adding SYS_ADMIN gives "Permission denied" from AppArmor.
    # All three are required. See docker-compose.yml for the long version.
    # ---- GPU, optional -------------------------------------------------
    # Only H.265-and-similar previews transcode; everything else is a stream
    # copy. On a machine with an NVIDIA card and the container toolkit, hand it
    # through and the agent detects it and uses NVDEC/NVENC. Without this the
    # card is invisible in here whatever the host has, and the agent correctly
    # falls back to libx264 -- see app/recorder/accel.py.
    #
    # Uncomment both, or set TRANSCODE_ACCEL=cpu to be explicit about not
    # wanting it.
    # runtime: nvidia
    # environment:
    #   NVIDIA_VISIBLE_DEVICES: all
    #   NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    cap_add: [NET_ADMIN, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    devices: ["/dev/ppp:/dev/ppp"]
    sysctls: {net.ipv4.ip_forward: 1}
    # Network namespace handles are runtime mount points, not persistent data.
    # Keeping /run/netns in the container's writable layer leaves dead files
    # behind after a host reboot: Docker restarts the same container, while the
    # kernel mounts the files referred to are gone, and the next `ip netns add`
    # fails with "File exists". A tmpfs is recreated empty on every start.
    tmpfs:
      - /run/netns
    volumes:
      - work:/var/lib/cam/work
      - ctl:/run/cam/ctl
    networks: [control]

volumes:
  pgdata:
  redisdata:
  work:
  ctl:

networks:
  control:
    driver: bridge
    ipam:
      config: [{subnet: "${CONTROL_SUBNET:-172.28.0.0/16}"}]
