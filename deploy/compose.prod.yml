# Production stack: pulls from Harbor, builds nothing.
#
# The target host needs exactly three files -- this one, `.env`, and
# `mediamtx.yml` beside it. No repository, no toolchain, no node.
#
#   docker compose -f compose.prod.yml --env-file .env up -d
#
# Every host-side port is overridable, because a machine that already runs other
# things will collide with at least one of them:
#
#   API_BIND=127.0.0.1:8100     WEB_BIND=127.0.0.1:3000
#   WHEP_BIND=127.0.0.1:8889    MEDIA_BIND=8189
#
# Only MEDIA_BIND is public. Everything else is loopback for nginx to proxy.
#
# Every service restarts unless stopped, so the stack survives a reboot.

name: cam-dashboard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cam}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cam}"]
      interval: 5s
      retries: 10
    networks: [control]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [control]

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: tcp
      # The address browsers dial for the UDP media leg. Wrong value and the
      # session negotiates and then video never starts, with nothing logged.
      MTX_WEBRTCADDITIONALHOSTS: ${PREVIEW_HOST:?set PREVIEW_HOST to the public hostname}
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]
    ports:
      # WHEP signalling, for nginx to proxy. Loopback only.
      - "${WHEP_BIND:-127.0.0.1:8889}:8889"
      # The video itself. This one is public: it goes straight from MediaMTX to
      # the browser over UDP and does not pass through nginx.
      - "${MEDIA_BIND:-8189}:8189/udp"
      #
      # RTSP ingest (8554) and the control API (9997) are deliberately NOT
      # published. The agent reaches them as `mediamtx:8554` and `mediamtx:9997`
      # over this network; the only thing a host port would serve is a
      # single-process dev run, and neither endpoint is authenticated.
    networks: [control]

  api:
    image: registry.example.com/camtunnel/cam-dashboard-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      CONNECT_MODE: agent
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Behind nginx. Move the host side with API_BIND if 8000 is taken.
    ports: ["${API_BIND:-127.0.0.1:8000}:8000"]
    volumes: [work:/var/lib/cam/work]
    networks: [control]

  web:
    image: registry.example.com/camtunnel/cam-dashboard-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_BIND:-127.0.0.1:3000}:3000"]
    networks: [control]

  agent:
    image: registry.example.com/camtunnel/cam-dashboard-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Winding up a live recording means joining and uploading what is on disk.
    # The 10s default kills that mid-upload and strands the segments.
    stop_grace_period: 120s
    # Creating a namespace is a mount: NET_ADMIN alone gives "Operation not
    # permitted", adding SYS_ADMIN gives "Permission denied" from AppArmor.
    # All three are required. See docker-compose.yml for the long version.
    cap_add: [NET_ADMIN, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    devices: ["/dev/ppp:/dev/ppp"]
    sysctls: {net.ipv4.ip_forward: 1}
    volumes:
      - work:/var/lib/cam/work
      - ctl:/run/cam/ctl
    networks: [control]

volumes:
  pgdata:
  redisdata:
  work:
  ctl:

networks:
  control:
    driver: bridge
    ipam:
      config: [{subnet: "${CONTROL_SUBNET:-172.28.0.0/16}"}]
